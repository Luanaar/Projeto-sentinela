<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

  <!-- Cabeçalho com botão da TV -->
   <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin: 0;">🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
    </div>
    <div class="pacientes-fila">
      <h3>
        Pacientes Cadastrados no Atendimento
        <span>Clique em "Chamar na TV" para chamar ao guichê</span>
      </h3> 
      <div id="fila-pacientes">
        <p style="color: rgb(207, 210, 224); text-align: center;">Carregando...</p>
      </div>
      <button onclick="carregarpacientes()" 
      style="margin-top: 8px; 
      background:#6c757d; color:white;
      border:none;
      padding:6px: 12px; 
      border-radius:4px;
       cursor: pointer;
      font-size: 13px;"> 🔄️ atualizar lista</button>
    </div>
 
  <style>
    .btn-v {
      background-color: rgb(216, 228, 224);
      color: antiquewhite;
      border: none;
      padding: 8px 14px;
      border-radius: 5x;
      cursor: pointer;
      font-size: 14px;
      margin-left: 8px;
    }
    .btn-tv:hover { background: #1e1e1e; }

    .pacientes-fila {
      margin-bottom: 30px;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid;
    }
    .pacientes-fila h3{
      margin-top: 0;
      color: rgb(172, 190, 205);
      display: flex;
      justify-content: space-between;
    }
    .pacientes-fila h3 span {
      font-size: 13px;
      font-weight: normal;
      color: rgb(230, 240, 240);
    }
    .fila-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgb(223, 181, 181);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: 1px solid darkblue;
    }
    .fila-item strong { font-size: 15px; }
    .fila-item small { color:blueviolet; font-size: 12px; }
    .btn-abrir-tv {
      display: incline-block;
      background: rgb(214, 171, 171);
      color: aliceblue;
      padding: 8px 14px;
      border-radius: 5px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-abrir-tv:hover {
      background: rebeccapurple;
    }
  </style>
<h2>🏥 Triagem Hospitalar</h2>
<input id="nome" placeholder="Nome">

<select id="sintoma">

<option value="">Selecione</option>
<option value="dor_leve">Dor leve</option>
<option value="resfriado">Resfriado</option>
<option value="coriza">Coriza</option>
<option value="tosse">Tosse</option>
<option value="febre">Febre</option>
<option value="vomito">Vômito</option>
<option value="diarreia">Diarreia</option>
<option value="falta_ar_moderada">Falta de ar moderada</option>
<option value="falta_ar_grave">Falta de ar grave</option>
<option value="infarto">Suspeita de infarto</option>
<option value="avc">Suspeita de AVC</option>
<option value="convulsao">Convulsão</option>
<option value="hemorragia">Hemorragia</option>

</select>

<input
  id="temp"
  type="number"
  placeholder="Temperatura"
/>

<input
  id="alergia"
  placeholder="Alergias"
/>

<textarea
  id="observacao"
  placeholder="Observações"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
Salvar Triagem
</button>

</div>

<script>

function classificarRisco(sintoma, temperatura){

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave",
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (temperatura >= 39) {
    return "vermelho";
  }

  if (vermelhos.includes(sintoma)) {
    return "vermelho";
  }

  if (amarelos.includes(sintoma)) {
    return "amarelo";
  }

  return "verde";
}

function salvar(){

  const nome = document.getElementById("nome").value;

  const sintoma =febre
    document.getElementById("sintoma").value;

  const temperatura =39
    Number(document.getElementById("temp").value);

  const alergia =nenhum 
    document.getElementById("alergia").value;

  const observacao =febre
    document.getElementById("observacao").value;

  const risco =vermelho
    classificarRisco(sintoma, temperatura);

  fetch("http://localhost:3000/triagem", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({

      nome,
      sintoma,
      temperatura,
      alergia,
      observacao,
      risco,

    })

  })

  .then(r => r.json())

  .then(data => {

    const resultado =
      document.getElementById("resultado");

    resultado.className = risco;

    resultado.innerHTML =
      "Classificação: " +
      risco.toUpperCase();

    alert("Triagem salva");

  });

}
function carregarPacientes() {
  fetch("/pacientes")
  .then(r =>.json())
  .then(pacientes => {
    const div = document.getElementById("fila-pacientes");
 
// Mostra apenas os com status "triagem"
 const fila = paciente.filter(p => p.status === "triagem");

  if (fila.length === 0) {
    div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando.</p>";
  return;
  }

  div.innerHTML = "";
  fila.forEach(p => {
    const item = document.createElement("div");
    item.className = "fila-item";
    item.innerHTML = `
    <div>
      <strong> ${p.nome}</strong><br>
      <small>CPF: ${p.cpf || "-"} | Tipo: ${p.tipo || "-"}</small>
      </div>
      <button class-"btn-tv" onclick="chamarNaTV('${p.nome}')">📺 Chamar na TV </button>`;
      div.appendChild(item);
    });
  })
.catch(() => {
  document.getElementById("fila-pacientes").innerHTML = 
  "<p style='color:red; '>Erro ao carregar pacientes.</p>";
});
}
//Função criada para enviar o nome do paciente para Tv quando
// Ele for chamado no guichê.
functionchamarNaTV(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "GUICHÊ",
      localNumero:"01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + "foi chamado na TV para o Guichê 01!");
  });
}

// Carregar a fila ao abrir a pagina
carregarPacientes();

//Atualizar a lista automaticamente a cada 10 segundo 
setInterval(carregarPacientes, 10000);
  
</script>

</body>
</html>
